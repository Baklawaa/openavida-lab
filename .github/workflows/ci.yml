name: CI

on:
  push:
  pull_request:

# A newer run on the same ref supersedes the one before it: cancelling the
# stale run keeps the queue short and the latest commit the one that reports.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Same sequence as `npm run verify`, split before the browser gates so a
      # unit failure skips the slow job.
      - run: npm run typecheck && npm test && npm run build
        env:
          # The timing budgets in tests/perf.test.ts are calibrated on a laptop
          # and stay tight there; a shared runner is ~2.5x slower per step, which
          # put the chemostat 0.01 ms over its budget. Scale them for this
          # hardware instead of loosening them for everyone.
          OPENAVIDA_PERF_BUDGET_SCALE: "3"

  gates:
    name: browser gates
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The verifiers launch the system Chrome (channel: "chrome"), which the
      # GitHub-hosted runner images ship.
      - run: npm run gates
      # A failed gate leaves screenshots and logs under scratch/; keep them
      # briefly so the run can be diagnosed from the artifact.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gates-scratch
          path: scratch/
          retention-days: 3
          if-no-files-found: ignore
