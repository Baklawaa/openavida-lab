name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  gates:
    name: browser gates
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The verifiers launch the system Chrome (channel: "chrome"), which the
      # GitHub-hosted runner images ship.
      - run: npm run gates
